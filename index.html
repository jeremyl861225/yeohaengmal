<script>
  // 使用者在設定裡指定深淺色時，第一次畫面就套用（開場畫面才不會先閃另一種底色）
  try { var t = (JSON.parse(localStorage.getItem('yeohaengmal/v1') || '{}').settings || {}).theme; if (t === 'dark' || t === 'light') document.documentElement.setAttribute('data-theme', t); } catch (e) {}
  // 開場（js/splash.js）：開場期間先藏住 App 本體，開場結束後才淡入；減少動態效果時沒有開場
  if (!(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches)) document.documentElement.classList.add('splashing');
  // 不能縮放（2026-10-03 使用者要求：不要支援雙擊或兩指縮放，固定頁寬）。iOS 會忽略 user-scalable=no，
  // 所以再擋 Safari 的縮放手勢事件與兩指觸控；雙擊放大由 CSS 的 touch-action 擋（不用 JS 擋，數字鍵連按才不會被吃掉）
  ['gesturestart', 'gesturechange', 'gestureend'].forEach(function (t) { document.addEventListener(t, function (e) { e.preventDefault(); }, { passive: false }); });
  document.addEventListener('touchmove', function (e) { if (e.touches.length > 1) e.preventDefault(); }, { passive: false });
</script>

<body>
<!--
THESIS: 旅ことば系列的「暮色玻璃」換成 ShaderGradient 的天色：背景是慢慢起伏的漸層波面（淺色 Halo＝橘、沙、淡紫；深色 Universe＝電光紫、珊瑚粉、黑），所有內容浮在液態玻璃上；路線圖、一站一課、字才是主角。拒絕：米色紙與平面卡片清單（2026-10-02 使用者要求韓文版套用日文版的新設計、換一套顏色）。
OWN-WORLD: 自寫著色器的 ShaderGradient 式波面（plane：雜訊起伏、斜向三色漸層、受光明暗、顆粒）；液態玻璃面板（半透明白／深紫、背景模糊、上緣高光、細白邊）；墨色膠囊主按鈕；韓文 Noto Serif KR 900 的單字與品牌、中文標題 Zen Old Mincho、中文內文宋體；漢字詞上方小字標漢字；首爾地鐵的墨色線號圓與三位數站號；家族色是韓國傳統色（쪽빛、하늘、치자、주황、연지、다홍、청록、자주）；分頁列是玻璃底板＋凹口裡的玻璃珠。
STORY: 打開時夜色亮成 Halo 的暖色、玻璃上浮出「旅」與「여행말」；接著看到下一站的玻璃大格與三條線；字卡用手指拖著換；到了韓國離線查字播音。
FIRST VIEWPORT: 開場（夜色→Halo、暖光升起、玻璃磚上的「旅」，約 1.7 秒、點一下跳過）；之後左上「여행말」（여행 上方標「旅行」）與已學字數；下一站玻璃大格（站號章、課名、進度格、出發鍵、流光邊框）；主題家族 3×3 玻璃格；可收合的三條線玻璃面板（墨色線號圓）。
FORM: 照搬旅ことば v22 的外觀與互動（使用者在日文版選 D 主題＋B 字體），只換天色（ShaderGradient Halo／Universe）、家族色與韓文字型。
FINISH: 2026-10-02 套用；沿用旅ことば的審查結論與 DESIGN.md 結構，韓文版自己的 DESIGN.md 已寫；未解：實機效能待測
-->
