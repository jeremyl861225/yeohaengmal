<script>
  // 使用者在設定裡指定深淺色時，第一次畫面就套用（開場畫面才不會先閃另一種底色）
  try { var t = (JSON.parse(localStorage.getItem('yeohaengmal/v1') || '{}').settings || {}).theme; if (t === 'dark' || t === 'light') document.documentElement.setAttribute('data-theme', t); } catch (e) {}
</script>

<body>
<!--
THESIS: 一本米色紙上的地鐵路線手帳（旅ことば系列的韓文版）：首頁是由必備往進階延伸的三條線，一站一課；色彩只出現在線、站點與按鈕上，字才是主角。
OWN-WORLD: 配色照旅ことば（2026-09-25 定案）：米白底 #f7f5f0、白色卡片＋細框，暖深咖啡深色模式（#1c1814）；八個主題家族各一個顏色（Colormind 色票主色），當點綴與下一站卡片的淡彩（約 12%），不鋪滿畫面；韓文明朝（打包的 Noto Serif KR 子集）、中文宋體，偏細；漢字詞上方用小字標漢字；首爾地鐵式的線號圓（墨色，不另加顏色）與三位數站號（101、201…）；膠囊鍵、18px 圓角選項磚、站點圓心落在不斷開的線上。
STORY: 旅客一眼看到下一站是哪一課，一站一站學完、考一考、把不穩的字打星，到了韓國離線查字播音。
FIRST VIEWPORT: 開啟時先有約一秒的開場（太極的紅藍圓與白色「旅」，點一下跳過）；之後左上「여행말」（여행 上方標「旅行」）與已學字數；下方是「下一站」卡片（路線章、課名、下一站是哪條線第幾站、每個字一格的進度、出發鍵）；其下是主題家族 3×3 色塊（篩選）與可收合的三條線。
FORM: 沿用旅ことば（日文版）定案的外觀，只換 App 名、圖示字、韓文字型與路線隱喻（2026-09-25）。
FINISH: unreviewed and undocumented is unfinished; this build ends with the finish review, the verdict, DESIGN.md, and every shipping raster carrying its provenance
-->
