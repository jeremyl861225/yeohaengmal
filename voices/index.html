<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#f9f9f7">
<title>여행말 聲音試聽</title>
<!-- 暫時的試聽頁：挑好男聲就刪掉（不在 sw.js 的預先快取裡） -->
<style>
  @font-face { font-family: "Yeohaengmal Serif"; src: url("../fonts/ko-serif.woff2") format("woff2"); font-weight: 400; font-display: swap; }
  :root {
    --ground: #f9f9f7; --surface: #ffffff; --ink: #1c1814; --ink-2: #5d5345; --ink-3: #8a7c66; --hair: #ebe7e0; --press: #efece6;
    --shadow: 0 0 0 1px rgba(60, 45, 25, 0.09), 0 6px 18px rgba(60, 45, 25, 0.05);
    --ui: -apple-system, "PingFang TC", "Noto Sans TC", system-ui, sans-serif;
    --ko: "Yeohaengmal Serif", "Noto Serif KR", "AppleMyungjo", "Nanum Myeongjo", "Apple SD Gothic Neo", serif;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--ground); color: var(--ink); font-family: var(--ui); -webkit-text-size-adjust: 100%; }
  main { max-width: 560px; margin: 0 auto; padding: calc(20px + env(safe-area-inset-top)) 16px calc(28px + env(safe-area-inset-bottom)); }
  h1 { margin: 0 0 6px; font-size: 24px; font-weight: 700; letter-spacing: 0.01em; }
  .lead { margin: 0 0 18px; font-size: 15px; line-height: 1.6; color: var(--ink-2); }
  .item { background: var(--surface); border-radius: 18px; box-shadow: var(--shadow); padding: 16px 14px 14px; margin: 0 0 12px; }
  .ko { margin: 0; font-family: var(--ko); font-size: 22px; line-height: 1.5; }
  .zh { margin: 2px 0 12px; font-size: 14px; color: var(--ink-2); }
  .btns { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  button {
    appearance: none; border: 0; margin: 0; cursor: pointer;
    display: flex; flex-direction: column; align-items: center; gap: 1px;
    padding: 10px 4px; border-radius: 12px; background: var(--ground); color: var(--ink);
    box-shadow: inset 0 0 0 1px var(--hair); font-family: var(--ui); -webkit-tap-highlight-color: transparent;
  }
  button:active { background: var(--press); }
  button .n { font-size: 16px; font-weight: 600; }
  button .g { font-size: 12px; color: var(--ink-2); }
  button .t { font-size: 11px; color: var(--ink-3); }
  button.now { background: var(--surface); box-shadow: inset 0 0 0 2px var(--ink); }   /* 正在播的那一個 */
  .foot { margin: 20px 2px 0; font-size: 13px; line-height: 1.6; color: var(--ink-3); }
  .foot strong { color: var(--ink); font-weight: 600; }
</style>
</head>
<body>
<main>
  <h1>여행말 聲音試聽</h1>
  <p class="lead">每一句都有三個聲音，點按鈕就會播。App 現在用的是 <b>SunHi 女聲</b>和 <b>InJoon 男聲</b>輪流念；<b>Hyunsu</b> 是另一個男聲候選。</p>
  <div id="list"></div>
  <p class="foot"><strong>挑好了回訊息告訴我：男聲要 InJoon 還是 Hyunsu。</strong><br>
  聲音由 Microsoft Edge 朗讀服務產生，只供個人學習使用。</p>
</main>
<audio id="player" preload="none"></audio>
<script>
  const VOICES = [
    { id: 'sunhi', name: 'SunHi', g: 'f', label: '女聲', tag: 'App 使用中' },
    { id: 'injoon', name: 'InJoon', g: 'm', label: '男聲', tag: 'App 使用中' },
    { id: 'hyunsu', name: 'Hyunsu', g: 'm', label: '男聲', tag: '候選' },
  ];
  const LINES = [
    { k: 'w1', ko: '감사합니다', zh: '謝謝' },
    { k: 'w2', ko: '같이 사진 찍어도 돼요?', zh: '可以一起拍照嗎？' },
    { k: 'w3', ko: '여권 여기 있어요.', zh: '護照在這裡。' },
    { k: 'w4', ko: '안녕하세요. 명동까지 어떻게 가요? 이거 얼마예요? 카드로 계산할게요. 감사합니다!', zh: '你好。去明洞怎麼走？這個多少錢？我用卡結帳。謝謝！' },
  ];
  const esc = (s) => s.replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  document.getElementById('list').innerHTML = LINES.map((l) => `
    <section class="item">
      <p class="ko" lang="ko">${esc(l.ko)}</p>
      <p class="zh">${esc(l.zh)}</p>
      <div class="btns">${VOICES.map((v) => `
        <button type="button" data-g="${v.g}" data-src="${v.id}-${l.k}.mp3" aria-label="${v.name} ${v.label}（${v.tag}）">
          <span class="n">${v.name}</span><span class="g">${v.label}</span><span class="t">${v.tag}</span>
        </button>`).join('')}
      </div>
    </section>`).join('');

  const player = document.getElementById('player');
  let current = null;
  const clear = () => { if (current) current.classList.remove('now'); current = null; };
  player.addEventListener('ended', clear);
  player.addEventListener('error', clear);
  document.addEventListener('click', (e) => {
    const b = e.target.closest('button[data-src]');
    if (!b) return;
    clear();
    current = b;
    b.classList.add('now');
    player.src = b.dataset.src;
    player.play().catch(clear);
  });
</script>
</body>
</html>
